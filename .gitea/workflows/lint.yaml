# Manifest, frontmatter, budget, and dead-link gate. Runs the same `make lint` a human runs
# locally, so CI and the workstation cannot drift.
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure python3
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq python3
          fi
          python3 --version
      - name: make lint
        run: make lint
